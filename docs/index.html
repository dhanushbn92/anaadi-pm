<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anaadi PM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  [hidden] { display: none !important; }

  :root {
    --bg: #F5F7F4;
    --surface: #FFFFFF;
    --surface-2: #EEF1EC;
    --border: #DCE2D7;
    --text: #1A2420;
    --text-muted: #5B6960;
    --accent: #1F6F65;
    --accent-strong: #154F48;
    --accent-soft: #E1F0ED;
    --gold: #B9822C;
    --gold-soft: #FBF0DC;
    --danger: #B3402F;
    --danger-soft: #FBEAE6;
    --success: #2E8B57;
    --success-soft: #E4F5EA;
    --shadow: 0 1px 2px rgba(20, 30, 25, 0.06), 0 4px 14px rgba(20, 30, 25, 0.06);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111714;
      --surface: #1A2320;
      --surface-2: #202B26;
      --border: #2C3933;
      --text: #E7ECE8;
      --text-muted: #93A49A;
      --accent: #57C4B4;
      --accent-strong: #7ED6C8;
      --accent-soft: #1C3934;
      --gold: #E0AD5C;
      --gold-soft: #3A2E19;
      --danger: #E2796A;
      --danger-soft: #3A2320;
      --success: #74CC98;
      --success-soft: #1D3427;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #111714;
    --surface: #1A2320;
    --surface-2: #202B26;
    --border: #2C3933;
    --text: #E7ECE8;
    --text-muted: #93A49A;
    --accent: #57C4B4;
    --accent-strong: #7ED6C8;
    --accent-soft: #1C3934;
    --gold: #E0AD5C;
    --gold-soft: #3A2E19;
    --danger: #E2796A;
    --danger-soft: #3A2320;
    --success: #74CC98;
    --success-soft: #1D3427;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-inline: 16px;
  }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; margin: 0 0 4px; font-weight: 600; text-wrap: balance; }
  p { margin: 0 0 8px; color: var(--text-muted); line-height: 1.5; }
  a { color: var(--accent-strong); }
  .muted { color: var(--text-muted); font-size: 0.85rem; }
  button, input, textarea, select { font-family: inherit; }

  /* ---------- shell ---------- */
  #topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 4px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    margin-inline: -16px;
    padding-inline: 16px;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--text); cursor: pointer; background: none; border: none; padding: 0; }
  .brand-mark { font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.15rem; }
  .brand-sub { font-size: 0.72rem; color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; }
  .viewer { display: flex; align-items: center; gap: 8px; }
  .viewer-name { font-size: 0.85rem; color: var(--text-muted); }

  #page { max-width: 1080px; margin: 0 auto; padding-bottom: 60px; }

  .avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; display: inline-block; background: var(--surface-2); vertical-align: middle; }
  .avatar-fallback { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; color: #fff; vertical-align: middle; }
  .avatar-sm, .avatar-fallback.sm { width: 20px; height: 20px; font-size: 0.65rem; }

  /* ---------- buttons ---------- */
  .btn { border: none; border-radius: 8px; padding: 9px 16px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s, opacity .15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover { background: var(--danger-soft); }
  .btn-small { padding: 4px 10px; font-size: 0.78rem; }
  .btn-icon { padding: 4px 8px; }
  .btn-add { width: 100%; margin-top: 8px; border: 1px dashed var(--border); background: transparent; color: var(--text-muted); }
  .btn-add:hover { background: var(--surface); border-color: var(--accent); color: var(--accent-strong); }

  /* ---------- page header ---------- */
  .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin: 20px 0 20px; }
  .page-header h1 { font-size: 1.6rem; }

  /* ---------- dashboard ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; cursor: pointer; text-align: left;
    display: flex; flex-direction: column; gap: 10px; transition: transform .12s, box-shadow .12s;
  }
  .card:hover { transform: translateY(-2px); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-top h3 { font-size: 1.05rem; }
  .card-desc { font-size: 0.85rem; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-foot { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .pill { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 100px; font-size: 0.7rem; font-weight: 700; white-space: nowrap; letter-spacing: 0.01em; }
  .pill-active { background: var(--success-soft); color: var(--success); }
  .pill-on_hold { background: var(--gold-soft); color: var(--gold); }
  .pill-completed { background: var(--accent-soft); color: var(--accent-strong); }
  .pill-archived { background: var(--surface-2); color: var(--text-muted); }

  .progress { width: 100%; height: 7px; background: var(--surface-2); border-radius: 100px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); border-radius: 100px; transition: width .25s; }

  .empty { text-align: center; padding: 60px 20px; border: 1px dashed var(--border); border-radius: var(--radius); background: var(--surface); }

  /* ---------- project view ---------- */
  .back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 0.85rem; text-decoration: none; margin-bottom: 10px; background: none; border: none; color: var(--accent-strong); cursor: pointer; padding: 0; }
  .project-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .project-actions { display: flex; gap: 8px; }
  .summary-bar {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 18px; margin: 14px 0 22px;
  }
  .summary-progress { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 6px; }
  .summary-progress span { font-size: 0.78rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .field-inline { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; }
  .field-inline select { text-transform: none; letter-spacing: normal; font-weight: 400; }

  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 720px) { .board { grid-template-columns: 1fr; } }
  .col { background: var(--surface-2); border-radius: var(--radius); padding: 10px; min-height: 140px; transition: background .12s; }
  .col.drag-over { background: var(--accent-soft); }
  .col-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 10px; }
  .col-head h3 { font-size: 0.88rem; text-transform: uppercase; letter-spacing: .03em; font-family: 'IBM Plex Sans'; font-weight: 700; color: var(--text-muted); }
  .col-count { font-size: 0.78rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .col-body { display: flex; flex-direction: column; gap: 8px; }

  .task {
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px;
    cursor: grab; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; text-align: left;
  }
  .task:active { cursor: grabbing; }
  .task-top { display: flex; align-items: center; gap: 7px; }
  .task-title { font-size: 0.87rem; font-weight: 600; flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-low { background: #8FA79C; }
  .dot-medium { background: var(--gold); }
  .dot-high { background: var(--danger); }
  .task-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.74rem; color: var(--text-muted); }
  .task-assignee { display: flex; align-items: center; gap: 5px; }
  .task-due.overdue { color: var(--danger); font-weight: 600; }

  /* ---------- modal ---------- */
  #modal-root:empty { display: none; }
  .overlay { position: fixed; inset: 0; background: rgba(10, 16, 13, 0.5); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal { background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 500px; max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 0; }
  .modal-body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 13px; }
  .modal-divider { border: none; border-top: 1px solid var(--border); margin: 2px 0; }

  label { display: flex; flex-direction: column; gap: 6px; font-size: 0.82rem; font-weight: 600; }
  input, textarea, select {
    font-size: 0.9rem; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface); color: var(--text); font-weight: 400;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { resize: vertical; font-family: inherit; }
  .row2 { display: flex; gap: 10px; }
  .row2 > label { flex: 1; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .actions-split { justify-content: space-between; align-items: center; }

  .banner { padding: 9px 12px; border-radius: 7px; font-size: 0.83rem; }
  .banner-error { background: var(--danger-soft); color: var(--danger); }
  .banner-info { background: var(--accent-soft); color: var(--accent-strong); }

  .typeahead { position: relative; }
  .typeahead-menu {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); z-index: 5;
    max-height: 220px; overflow-y: auto;
  }
  .typeahead-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; font-size: 0.85rem; }
  .typeahead-item:hover, .typeahead-item.active { background: var(--surface-2); }

  .comments { display: flex; flex-direction: column; gap: 9px; max-height: 200px; overflow-y: auto; }
  .comment { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
  .comment-meta { display: flex; align-items: center; gap: 6px; font-size: 0.76rem; margin-bottom: 3px; }
  .comment-meta b { font-size: 0.8rem; }
  .comment p { margin: 0; color: var(--text); font-size: 0.87rem; }
  .comment-form { display: flex; flex-direction: column; gap: 8px; }

  .toast-wrap { position: fixed; bottom: max(20px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 0.85rem; box-shadow: var(--shadow); }

  .who-screen { max-width: 420px; margin: 70px auto; text-align: center; }
  .who-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .who-btn {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); cursor: pointer; text-align: left;
    font-size: 1rem; font-weight: 600; color: var(--text); box-shadow: var(--shadow);
    transition: transform .12s, border-color .12s;
  }
  .who-btn:hover { transform: translateY(-1px); border-color: var(--accent); }
  .who-btn .avatar-fallback { width: 34px; height: 34px; font-size: 0.95rem; }

  .sync-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 100px;
    border: 1px solid var(--border); background: transparent; color: var(--text-muted);
    font-size: 0.74rem; font-weight: 600; cursor: pointer;
  }
  .sync-pill:hover { background: var(--surface-2); }
  .sync-pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
  .sync-ok::before { background: var(--success); }
  .sync-syncing::before { background: var(--gold); }
  .sync-error { color: var(--danger); border-color: var(--danger); }
  .sync-error::before { background: var(--danger); }
  .invite-input { font-size: 0.78rem; }
  @media (max-width: 520px) { .viewer-name { display: none; } }
</style>
</head>
<body>

<div id="topbar">
  <button class="brand" id="brand-btn" type="button">
    <span class="brand-mark">Anaadi PM</span>
  </button>
  <div class="viewer" id="viewer-slot"></div>
</div>
<div id="page"><div class="muted" style="padding:40px 0;">Loading…</div></div>
<div id="modal-root"></div>
<div class="toast-wrap" id="toast-wrap"></div>

<script>
(function () {
  'use strict';

  // ---------------- utilities ----------------
  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function isOverdue(iso, status) {
    if (!iso || status === 'done') return false;
    var d = new Date(iso);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    return d < today;
  }
  function todayISO() {
    var d = new Date(); return d.toISOString().slice(0, 10);
  }
  function initials(name) {
    return (name || '?').trim().charAt(0).toUpperCase() || '?';
  }

  var STATUS_LABEL = { active: 'Active', on_hold: 'On hold', completed: 'Completed', archived: 'Archived' };
  var TASK_STATUSES = [['todo', 'To do'], ['in_progress', 'In progress'], ['done', 'Done']];
  var PEOPLE = ['Dhanush', 'Rishi', 'Keshav'];
  var PEOPLE_COLORS = { Dhanush: '#1F6F65', Rishi: '#B9822C', Keshav: '#6E5B9E' };
  var WHO_KEY = 'anaadi_pm_who';
  var STORE_KEY = 'anaadi_pm_data_v1';

  function uid() { return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }
  function nowISO() { return new Date().toISOString(); }

  // ---------------- state ----------------
  var state = {
    who: null,
    projects: [],
    tasks: [],
    comments: [],
    openTaskId: null,
    picking: false,
    route: { page: 'dashboard', projectId: null }
  };

  var pageEl = document.getElementById('page');
  var modalRoot = document.getElementById('modal-root');
  var toastWrap = document.getElementById('toast-wrap');

  function showToast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    toastWrap.appendChild(t);
    setTimeout(function () { t.remove(); }, 4200);
  }

  // ---------------- local cache (this device's copy of the board) ----------------
  function loadStore() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        return {
          projects: parsed.projects || [],
          tasks: parsed.tasks || [],
          comments: parsed.comments || []
        };
      }
    } catch (e) {}
    return { projects: [], tasks: [], comments: [] };
  }
  function saveCache() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        projects: state.projects, tasks: state.tasks, comments: state.comments
      }));
    } catch (e) {
      showToast('Could not save — this browser’s storage may be full or blocked.');
    }
  }

  // ---------------- fixed people ----------------
  function colorFor(name) { return PEOPLE_COLORS[name] || '#8FA79C'; }
  function avatarHTML(name, size) {
    var cls = size === 'sm' ? 'avatar-fallback sm' : 'avatar-fallback';
    var bg = colorFor(name);
    var letter = esc(initials(name));
    return '<span class="' + cls + '" style="background:' + esc(bg) + '">' + letter + '</span>';
  }

  // ---------------- derived data ----------------
  function tasksForProject(pid) {
    return state.tasks.filter(function (t) { return t.projectId === pid; });
  }
  function counts(pid) {
    var ts = tasksForProject(pid);
    var done = ts.filter(function (t) { return t.status === 'done'; }).length;
    return { total: ts.length, done: done, progress: ts.length ? Math.round((done / ts.length) * 100) : 0 };
  }

  // ---------------- data actions ----------------
  // Every change is an op: applied to this device immediately, then (when connected) queued for the shared sheet.
  function dataOf(item) {
    var d = Object.assign({}, item);
    delete d.id;
    return d;
  }
  function upsertOp(type, item) { return { op: 'upsert', type: type, id: item.id, data: dataOf(item) }; }
  function indexOfId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return i;
    return -1;
  }
  function listFor(type) {
    return type === 'project' ? state.projects : type === 'task' ? state.tasks : state.comments;
  }
  function applyOpLocal(op) {
    if (op.op === 'upsert') {
      var list = listFor(op.type);
      var item = Object.assign({ id: op.id }, op.data);
      var i = indexOfId(list, op.id);
      if (i === -1) list.push(item); else list[i] = item;
    } else if (op.op === 'patch') {
      [state.projects, state.tasks, state.comments].forEach(function (l) {
        var j = indexOfId(l, op.id);
        if (j !== -1) Object.assign(l[j], op.data);
      });
    } else {
      state.projects = state.projects.filter(function (x) { return x.id !== op.id; });
      state.tasks = state.tasks.filter(function (x) { return x.id !== op.id; });
      state.comments = state.comments.filter(function (x) { return x.id !== op.id; });
    }
  }
  function commit(ops) {
    ops.forEach(applyOpLocal);
    sync.rev++;
    saveCache();
    if (sync.url) {
      sync.queue = sync.queue.concat(ops);
      saveQueue();
      flush();
    }
    if (state.who) renderBoard();
  }

  function createProject(data) {
    var p = {
      id: uid(),
      name: data.name.trim(),
      description: data.description || '',
      status: 'active',
      dueDate: data.dueDate || null,
      createdBy: state.who,
      createdAt: nowISO(),
      updatedAt: nowISO()
    };
    commit([upsertOp('project', p)]);
    return p;
  }
  function updateProject(id, patch) {
    commit([{ op: 'patch', id: id, data: Object.assign({}, patch, { updatedAt: nowISO() }) }]);
  }
  function deleteProjectCascade(id) {
    var ops = [];
    tasksForProject(id).forEach(function (t) {
      state.comments.forEach(function (c) { if (c.taskId === t.id) ops.push({ op: 'delete', id: c.id }); });
      ops.push({ op: 'delete', id: t.id });
    });
    ops.push({ op: 'delete', id: id });
    commit(ops);
  }
  function createTask(projectId, data) {
    var status = data.status || 'todo';
    var siblings = tasksForProject(projectId).filter(function (t) { return t.status === status; });
    var maxOrder = siblings.reduce(function (m, t) { return Math.max(m, t.order || 0); }, -1);
    var t = {
      id: uid(),
      projectId: projectId,
      title: data.title.trim(),
      description: data.description || '',
      status: status,
      priority: data.priority || 'medium',
      assignee: data.assignee || null,
      dueDate: data.dueDate || null,
      createdBy: state.who,
      createdAt: nowISO(),
      order: maxOrder + 1
    };
    commit([upsertOp('task', t)]);
    return t;
  }
  function updateTask(id, patch) {
    commit([{ op: 'patch', id: id, data: patch }]);
  }
  function deleteTaskCascade(id) {
    var ops = state.comments
      .filter(function (c) { return c.taskId === id; })
      .map(function (c) { return { op: 'delete', id: c.id }; });
    ops.push({ op: 'delete', id: id });
    commit(ops);
  }
  function addComment(taskId, body) {
    var c = { id: uid(), taskId: taskId, body: body.trim(), author: state.who, createdAt: nowISO() };
    commit([upsertOp('comment', c)]);
    return c;
  }
  function changedFields(original, next) {
    var patch = {};
    Object.keys(next).forEach(function (k) {
      var a = original[k] === undefined || original[k] === '' ? null : original[k];
      var b = next[k] === undefined || next[k] === '' ? null : next[k];
      if (a !== b) patch[k] = next[k];
    });
    return patch;
  }
  function commentsForTask(taskId) {
    return state.comments
      .filter(function (c) { return c.taskId === taskId; })
      .sort(function (a, b) { return (a.createdAt || '').localeCompare(b.createdAt || ''); });
  }

  // ---------------- sync (a Google Sheet, through its Apps Script web app) ----------------
  var SYNC_URL_KEY = 'anaadi_pm_sync_url';
  var QUEUE_KEY = 'anaadi_pm_queue_v1';
  var POLL_MS = 15000;
  var FULL_REFRESH_MS = 60000;
  var SYNC_URL_PATTERN = /^https:\/\/script\.google\.com\/(?:a\/macros\/[^\/]+|macros)\/s\/[\w-]+\/exec$/;

  var sync = {
    url: null,
    status: 'local',
    queue: [],
    flushing: false,
    polling: false,
    rev: 0,
    version: null,
    sig: '',
    lastFullAt: 0,
    retryTimer: null,
    pollTimer: null
  };

  function loadSyncSettings() {
    try { sync.url = localStorage.getItem(SYNC_URL_KEY) || null; } catch (e) {}
    try { sync.queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { sync.queue = []; }
    if (!Array.isArray(sync.queue)) sync.queue = [];
    sync.status = sync.url ? 'syncing' : 'local';
  }
  function saveQueue() {
    try { localStorage.setItem(QUEUE_KEY, JSON.stringify(sync.queue)); } catch (e) {}
  }

  function parseSyncResponse(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
  function syncGet(url, useVersion) {
    var q = '?action=list&_=' + Date.now();
    if (useVersion && sync.version !== null) q += '&v=' + sync.version;
    return fetch(url + q, { credentials: 'omit' }).then(parseSyncResponse);
  }
  function syncPost(ops) {
    return fetch(sync.url, {
      method: 'POST',
      credentials: 'omit',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ ops: ops })
    }).then(parseSyncResponse);
  }

  function applyRemote(res, force) {
    var sig = JSON.stringify(res.records);
    sync.version = res.version;
    sync.lastFullAt = Date.now();
    if (!force && sig === sync.sig) return;
    sync.sig = sig;
    var next = { projects: [], tasks: [], comments: [] };
    res.records.forEach(function (r) {
      var item = Object.assign({ id: r.id }, r.data);
      if (r.type === 'project') next.projects.push(item);
      else if (r.type === 'task') next.tasks.push(item);
      else if (r.type === 'comment') next.comments.push(item);
    });
    state.projects = next.projects;
    state.tasks = next.tasks;
    state.comments = next.comments;
    saveCache();
    if (state.who) {
      renderBoard();
      refreshOpenComments();
    }
  }

  function setSyncStatus(s) {
    sync.status = s;
    renderSyncPill();
  }
  function renderSyncPill() {
    var el = document.getElementById('sync-pill');
    if (!el) return;
    var labels = {
      local: ['Local only', 'Saved on this device only. Click to share the board with your team.'],
      syncing: ['Syncing…', 'Talking to the shared board.'],
      ok: ['Synced', 'Connected to the shared board.'],
      error: ['Offline', 'Can’t reach the shared board. Your changes are kept and upload automatically.']
    };
    var l = labels[sync.status] || labels.local;
    el.className = 'sync-pill sync-' + sync.status;
    el.textContent = l[0];
    el.title = l[1];
  }

  function flush() {
    if (!sync.url || sync.flushing || !sync.queue.length) return;
    clearTimeout(sync.retryTimer);
    sync.flushing = true;
    setSyncStatus('syncing');
    var batch = sync.queue.slice(0, 100);
    syncPost(batch).then(function (res) {
      if (!res.ok && res.retry) throw new Error(res.error || 'busy');
      sync.queue.splice(0, batch.length);
      saveQueue();
      sync.flushing = false;
      if (!res.ok) showToast('Couldn’t save a change: ' + res.error);
      if (sync.queue.length) { flush(); return; }
      if (res.ok) {
        applyRemote(res, true);
        setSyncStatus('ok');
      } else {
        poll(true);
      }
    }).catch(function () {
      sync.flushing = false;
      setSyncStatus('error');
      sync.retryTimer = setTimeout(flush, 8000);
    });
  }

  function poll(full) {
    if (!sync.url || sync.flushing || sync.polling || sync.queue.length) return;
    sync.polling = true;
    var rev = sync.rev;
    var useVersion = !full && Date.now() - sync.lastFullAt < FULL_REFRESH_MS;
    syncGet(sync.url, useVersion).then(function (res) {
      sync.polling = false;
      if (!res.ok) throw new Error(res.error || 'bad reply');
      if (sync.rev !== rev || sync.flushing || sync.queue.length) return;
      if (!res.unchanged) applyRemote(res, false);
      setSyncStatus('ok');
    }).catch(function () {
      sync.polling = false;
      setSyncStatus('error');
    });
  }

  function startSync() {
    stopSync();
    sync.pollTimer = setInterval(function () { if (!document.hidden) poll(false); }, POLL_MS);
    flush();
    poll(true);
  }
  function stopSync() {
    clearInterval(sync.pollTimer);
    clearTimeout(sync.retryTimer);
  }

  function hasLocalData() {
    return state.projects.length + state.tasks.length + state.comments.length > 0;
  }
  function localAsOps() {
    return state.projects.map(function (x) { return upsertOp('project', x); })
      .concat(state.tasks.map(function (x) { return upsertOp('task', x); }))
      .concat(state.comments.map(function (x) { return upsertOp('comment', x); }));
  }

  function connectTo(url) {
    return syncGet(url, false).then(function (res) {
      if (!res.ok || !Array.isArray(res.records)) throw new Error(res.error || 'Unexpected reply');
      var uploadLocal = !res.records.length && hasLocalData();
      sync.url = url;
      try { localStorage.setItem(SYNC_URL_KEY, url); } catch (e) {}
      sync.version = null;
      sync.sig = '';
      sync.queue = uploadLocal ? localAsOps() : [];
      saveQueue();
      if (!uploadLocal) applyRemote(res, true);
      setSyncStatus('syncing');
      startSync();
      if (state.who) renderBoard();
    });
  }
  function disconnect() {
    stopSync();
    sync.url = null;
    sync.queue = [];
    sync.version = null;
    sync.sig = '';
    saveQueue();
    try { localStorage.removeItem(SYNC_URL_KEY); } catch (e) {}
    setSyncStatus('local');
    if (state.who) renderBoard();
  }

  function extractSyncUrl(text) {
    var t = String(text || '').trim();
    var i = t.indexOf('#sync=');
    if (i !== -1) {
      try { t = decodeURIComponent(t.slice(i + 6)); } catch (e) { return ''; }
    }
    return SYNC_URL_PATTERN.test(t) ? t : '';
  }
  function readInviteFromHash() {
    var url = extractSyncUrl(location.hash);
    if (location.hash) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    }
    return url;
  }

        '<button type="button" class="btn btn-primary" data-role="cancel">Done</button></div></div>' +
        '<p class="muted">Disconnecting keeps a copy of the board on this device.</p>';

        '<div class="banner banner-error" id="sy-error" hidden></div>' +
        '<label>Sync link<input id="sy-url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>' +
        '<div class="actions"><button type="button" class="btn btn-ghost" data-role="cancel">Cancel</button>' +
        '<button type="button" class="btn btn-primary" id="sy-connect">Connect</button></div>';

    var html = '<div class="modal-head"><h2>Shared board</h2>' +
      '<button class="btn btn-ghost btn-icon" data-role="close" type="button">✕</button></div>' +
      '<div class="modal-body">' + body + '</div>';

    openModal(html, function (root) {
      root.querySelector('[data-role="close"]').onclick = closeModal;
      root.querySelector('[data-role="cancel"]').onclick = closeModal;
      if (connected) {
        var inviteEl = root.querySelector('#sy-invite');
        inviteEl.addEventListener('focus', function () { inviteEl.select(); });
        root.querySelector('#sy-copy').onclick = function () {
          inviteEl.select();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(inviteEl.value).then(
              function () { showToast('Invite link copied'); },
              function () { showToast('Press Ctrl+C to copy the selected link'); }
            );
          } else {
            showToast('Press Ctrl+C to copy the selected link');
          }
        };
        root.querySelector('#sy-disconnect').onclick = function () { disconnect(); closeModal(); };
      } else {
        root.querySelector('#sy-connect').onclick = function () {
          var btn = this;
          var err = root.querySelector('#sy-error');
          var url = extractSyncUrl(root.querySelector('#sy-url').value);
          err.hidden = true;
          if (!url) {
            err.hidden = false;
            err.textContent = 'That doesn’t look like a sync link. It should start with https://script.google.com/ and end with /exec.';
            return;
          }
          btn.disabled = true; btn.textContent = 'Connecting…';
          connectTo(url).then(function () {
            closeModal();
            showToast('Connected to the shared board');
          }).catch(function () {
            btn.disabled = false; btn.textContent = 'Connect';
            err.hidden = false;
            err.textContent = 'Couldn’t reach the shared board. Check the link, and that the script is deployed with access set to “Anyone”.';
          });
        };
      }
    });
  }

  function twoStepDelete(btn, label, onConfirm) {
    var armed = false;
    var timer = null;
    btn.textContent = label;
    btn.addEventListener('click', function () {
      if (!armed) {
        armed = true;
        btn.textContent = 'Click again to confirm';
        btn.classList.add('btn-danger');
        timer = setTimeout(function () { armed = false; btn.textContent = label; }, 4000);
      } else {
        clearTimeout(timer);
        btn.disabled = true;
        btn.textContent = 'Deleting…';
        onConfirm();
      }
    });
  }

      var ts = tasksForProject(project.id).filter(function (t) { return t.status === key; })
        .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      var cards = ts.map(taskCardHTML).join('');
      return '<div class="col" data-status="' + key + '">' +
        '<div class="col-head"><h3>' + label + '</h3><span class="col-count">' + ts.length + '</span></div>' +
        '<div class="col-body">' + cards + '</div>' +
        '<button class="btn btn-add" data-add-status="' + key + '" type="button">+ Add task</button>' +
        '</div>';
    }).join('');

    return '<button class="back-link" id="btn-back" type="button">← All projects</button>' +
      '<div class="project-head"><div><h1>' + esc(project.name) + '</h1>' +
      (project.description ? '<p>' + esc(project.description) + '</p>' : '') + '</div>' +
      '<div class="project-actions"><button class="btn btn-ghost" id="btn-edit-project" type="button">Edit</button></div></div>' +
      '<div class="summary-bar">' +
      '<div class="summary-progress"><div class="progress"><div style="width:' + c.progress + '%"></div></div>' +
      '<span>' + c.progress + '% · ' + c.done + '/' + c.total + ' tasks done</span></div>' +
      '<label class="field-inline">Status<select id="project-status">' +
      Object.keys(STATUS_LABEL).map(function (k) {
        return '<option value="' + k + '"' + (project.status === k ? ' selected' : '') + '>' + STATUS_LABEL[k] + '</option>';
      }).join('') + '</select></label>' + due +
      '</div>' +
      '<div class="board">' + cols + '</div>';
  }

  function taskCardHTML(t) {
    var overdue = isOverdue(t.dueDate, t.status);
    return '<div class="task" draggable="true" data-task="' + esc(t.id) + '">' +
      '<div class="task-top"><span class="dot dot-' + esc(t.priority) + '"></span><span class="task-title">' + esc(t.title) + '</span></div>' +
      '<div class="task-meta">' +
      (t.assignee ? '<span class="task-assignee">' + avatarHTML(t.assignee, 'sm') + esc(t.assignee) + '</span>' : '<span></span>') +
      (t.dueDate ? '<span class="task-due' + (overdue ? ' overdue' : '') + '">' + esc(fmtDate(t.dueDate)) + '</span>' : '') +
      '</div></div>';
  }

  function wireProject(el, project) {
    el.querySelector('#btn-back').onclick = goDashboard;
    el.querySelector('#btn-edit-project').onclick = function () { openEditProjectModal(project); };
    el.querySelector('#project-status').addEventListener('change', function (e) {
      updateProject(project.id, { status: e.target.value });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-add-status]'), function (btn) {
      btn.addEventListener('click', function () { openNewTaskModal(project.id, btn.getAttribute('data-add-status')); });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-task]'), function (card) {
      var id = card.getAttribute('data-task');
      card.addEventListener('click', function () {
        var task = state.tasks.find(function (t) { return t.id === id; });
        if (task) openTaskModal(task);
      });
      card.addEventListener('dragstart', function (e) {
        dragTaskId = id;
        e.dataTransfer.setData('text/plain', id);
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('.col'), function (col) {
      col.addEventListener('dragover', function (e) { e.preventDefault(); col.classList.add('drag-over'); });
      col.addEventListener('dragleave', function () { col.classList.remove('drag-over'); });
      col.addEventListener('drop', function (e) {
        e.preventDefault();
        col.classList.remove('drag-over');
        var id = e.dataTransfer.getData('text/plain') || dragTaskId;
        var status = col.getAttribute('data-status');
        var task = state.tasks.find(function (t) { return t.id === id; });
        if (!task || task.status === status) return;
        updateTask(id, { status: status });
      });
    });
  }

  // ---------------- board root ----------------
  function renderBoard() {
    if (state.picking) return;
    if (state.route.page === 'dashboard') {
      pageEl.innerHTML = dashboardHTML();
      wireDashboard(pageEl);
    } else {
      var project = state.projects.find(function (p) { return p.id === state.route.projectId; });
      if (!project) {
        pageEl.innerHTML = '<p class="muted" style="margin-top:30px;">Project not found or was deleted. <a href="#" id="back2">Back to all projects</a></p>';
        pageEl.querySelector('#back2').addEventListener('click', function (e) { e.preventDefault(); goDashboard(); });
        return;
      }
      pageEl.innerHTML = projectHTML(project);
      wireProject(pageEl, project);
    }
  }

  // ---------------- shell / boot ----------------
  function renderShell() {
    var slot = document.getElementById('viewer-slot');
    slot.innerHTML = '<button class="sync-pill" id="sync-pill" type="button"></button>' +
      avatarHTML(state.who) + '<span class="viewer-name">' + esc(state.who) + '</span>' +
      '<button class="btn btn-ghost btn-small" id="btn-switch-who" type="button">Switch</button>';
    document.getElementById('btn-switch-who').onclick = showWhoPicker;
    document.getElementById('sync-pill').onclick = openSyncModal;
    document.getElementById('brand-btn').onclick = goDashboard;
    renderSyncPill();
  }

  // ---------------- who-are-you picker ----------------
  function whoPickerHTML() {
    var buttons = PEOPLE.map(function (name) {
      return '<button class="who-btn" type="button" data-who="' + esc(name) + '">' +
        avatarHTML(name) + '<span>' + esc(name) + '</span></button>';
    }).join('');
    return '<div class="who-screen"><h1>Who’s this?</h1>' +
      '<p>Pick your name to continue — it’s used to attribute the tasks and comments you add on this board.</p>' +
      '<div class="who-buttons">' + buttons + '</div></div>';
  }
  function showWhoPicker() {
    state.picking = true;
    pageEl.innerHTML = whoPickerHTML();
    Array.prototype.forEach.call(pageEl.querySelectorAll('[data-who]'), function (btn) {
      btn.addEventListener('click', function () { chooseWho(btn.getAttribute('data-who')); });
    });
  }
  function chooseWho(name) {
    state.picking = false;
    state.who = name;
    try { localStorage.setItem(WHO_KEY, name); } catch (e) {}
    boot();
  }

  var pendingInvite = '';

  function boot() {
    renderShell();
    renderBoard();
    if (pendingInvite) {
      var url = pendingInvite;
      pendingInvite = '';
      connectTo(url).then(function () {
        showToast('Connected to the shared board');
      }).catch(function () {
        showToast('Couldn’t connect with that invite link');
      });
    }
  }

  function init() {
    var stored = loadStore();
    state.projects = stored.projects;
    state.tasks = stored.tasks;
    state.comments = stored.comments;

    loadSyncSettings();
    var invite = readInviteFromHash();
    if (invite && invite !== sync.url) pendingInvite = invite;
    if (sync.url) startSync();

    var saved = null;
    try { saved = localStorage.getItem(WHO_KEY); } catch (e) {}
    if (saved && PEOPLE.indexOf(saved) !== -1) {
      state.who = saved;
      boot();
    } else {
      showWhoPicker();
    }

    // Other tabs of this browser share the same device copy; when connected, polling keeps them current.
    window.addEventListener('storage', function (e) {
      if (e.key !== STORE_KEY || sync.url) return;
      var fresh = loadStore();
      state.projects = fresh.projects;
      state.tasks = fresh.tasks;
      state.comments = fresh.comments;
      if (state.who) renderBoard();
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(false); });
    window.addEventListener('online', function () { flush(); poll(false); });
  }

  init();
})();
</script>
</body>
</html>
